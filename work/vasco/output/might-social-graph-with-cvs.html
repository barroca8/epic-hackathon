<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MighT Social Graph</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<style>
  :root{--ink:#222;--accent:#836c36;--panel:#fff;--bg:#f6f6f6;--shadow:0 3px 8px rgba(0,0,0,.12)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);font-family:"Trebuchet MS",Arial,Helvetica,sans-serif;color:var(--ink)}
  #graph{position:fixed;inset:0}
  #graph svg{width:100%;height:100%;display:block;cursor:grab}
  .panel{position:fixed;left:14px;background:var(--panel);box-shadow:var(--shadow);padding:18px 20px;width:190px;z-index:2}
  #menu{top:14px}
  #legend{top:auto;bottom:14px;font-size:12.5px;line-height:1.75;letter-spacing:.3px}
  #logo{display:block;margin:4px auto 10px;width:140px;height:auto}
  .tagline{text-align:center;font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:#888;margin-bottom:16px}
  h1{font-size:13px;font-weight:normal;margin:0 0 6px}
  button,.btn{font:inherit;font-size:13px;background:#333;color:#fff;border:0;padding:10px 0;width:100%;cursor:pointer;transition:background .15s}
  button:hover{background:var(--accent)}
  label{font-size:13px;display:block;margin:16px 0 5px}
  input[type=text]{width:100%;font:inherit;font-size:13px;padding:7px 8px;border:1px solid #ccc}
  #pick{margin-top:7px}
  #info{margin-top:10px;font-size:12px;text-align:center;color:var(--accent);min-height:1em}
  .lg{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
  .lg i{width:10px;height:10px;border-radius:50%;flex:none}
  .lg.off{opacity:.3}
  .link{stroke:rgba(17,182,186,.8);stroke-opacity:calc(.08 + var(--affinity)*.55);stroke-width:calc(.5px + var(--affinity)*4px);cursor:help}
  .link.out{stroke:#fa0;stroke-opacity:.6}
  .link.in{stroke:#034;stroke-opacity:.6}
  .link.both{stroke:#e0412b;stroke-opacity:.7}
  .node{opacity:.9;stroke-width:0;cursor:pointer}
  .node.sel{stroke:#fff;stroke-width:4px;opacity:1}
  .dim{opacity:.12!important}
  #tip{position:fixed;pointer-events:none;background:#222;color:#fff;font-size:12px;padding:7px 10px;opacity:0;transition:opacity .1s;z-index:3;line-height:1.5}
  .note{font-size:10.5px;color:#999;margin-top:12px;line-height:1.4}
</style>
</head>

const cvSlug = value => value.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const cvPeople = new Map(DATA.nodes.map(node => [`person:${cvSlug(node.name)}`, node.id]));
const cvNodeIds = new Set(DATA.nodes.map(node => node.id));
for (const triple of CV_TRIPLES) {
  let source = cvPeople.get(triple.subject);
  if (!source) {
    source = triple.subject;
    if (!cvNodeIds.has(source)) {
      DATA.nodes.push({id: source, name: triple.subject.split(":")[1].replace(/-/g, " "), group: "CV Profile", rec: 7, sent: 7, kind: "person"});
      cvNodeIds.add(source);
    }
  }
  if (!cvNodeIds.has(triple.object)) {
    const kind = triple.object.split(":")[0];
    DATA.nodes.push({id: triple.object, name: triple.label || triple.object.split(":")[1].replace(/-/g, " "), group: `CV · ${kind}`, rec: 5, sent: 5, kind});
    cvNodeIds.add(triple.object);
  }
  DATA.edges.push([source, triple.object]);
}
const AFFINITY_BY_PAIR = new Map();
for (const triple of AFFINITY_TRIPLES) {
  const source = cvPeople.get(triple.subject);
  const target = cvPeople.get(triple.object);
  if (source != null && target != null) AFFINITY_BY_PAIR.set(`${source}|${target}`, triple.weight);
}

const COLORS = {
  "Marca A":"rgba(93,107,112,1)","Marca B":"rgba(192,225,148,1)","Marca C":"rgba(253,128,112,1)",
  "Marca D":"rgba(17,182,186,1)","Corporativo":"rgba(102,198,155,1)","Marca E":"rgba(155,224,215,1)",
  "Marca F":"rgba(204,164,138,1)","Marca G":"rgba(255,207,155,1)","Marca H":"rgba(249,177,100,1)",
  "Facilitação":"rgba(254,229,133,1)","Programa":"rgba(131,108,54,1)",
  "CV Profile":"rgba(141,92,246,1)","CV · skill":"rgba(43,196,138,1)","CV · role":"rgba(255,173,51,1)","CV · company":"rgba(70,130,220,1)"
};
const color = g => COLORS[g] || "rgba(254,229,133,1)";

const nodes = DATA.nodes.map(d => ({...d}));
const byId = new Map(nodes.map(n => [n.id, n]));
const links = DATA.edges.map(([s,t]) => ({source:s, target:t, affinity: AFFINITY_BY_PAIR.get(`${s}|${t}`) ?? 0}));

let sizeBySent = false;
const hidden = new Set();
const radius = d => Math.max(3, sizeBySent ? d.sent : d.rec);

// Legend
const legend = d3.select("#legend");
legend.append("div").style("font-weight","bold").style("margin-bottom","4px").text("Grupos");
Object.keys(COLORS).forEach(g => {
  if (!nodes.some(n => n.group === g)) return;
  const row = legend.append("div").attr("class","lg").on("click", function(){
    hidden.has(g) ? hidden.delete(g) : hidden.add(g);
    d3.select(this).classed("off", hidden.has(g));
    applyFilter();
  });
  row.append("i").style("background", color(g));
  row.append("span").text(g);
});
legend.append("div").attr("class","note").text("Dados fictícios. Clica num grupo para o esconder. Espessura da ligação = affinity_score. Laranja = enviadas, azul-escuro = recebidas, vermelho = mútuas.");

// Graph
const svg = d3.select("#graph").append("svg");
const g = svg.append("g");
svg.call(d3.zoom().scaleExtent([.2, 4]).on("zoom", e => g.attr("transform", e.transform)));

const link = g.append("g").selectAll("line").data(links).join("line").attr("class","link")
  .style("--affinity", d => d.affinity / 100)
  .on("mouseover", (e,d) => showLinkTip(e,d)).on("mousemove", moveTip).on("mouseout", hideTip);
const node = g.append("g").selectAll("circle").data(nodes).join("circle")
  .attr("class","node").attr("r", radius).attr("fill", d => color(d.group))
  .on("mouseover", (e,d) => { highlight(d.id); showTip(e,d); })
  .on("mousemove", moveTip)
  .on("mouseout", () => { clearHighlight(); hideTip(); })
  .call(d3.drag()
    .on("start", (e,d) => { if (!e.active) sim.alphaTarget(.2).restart(); d.fx=d.x; d.fy=d.y; })
    .on("drag", (e,d) => { d.fx=e.x; d.fy=e.y; })
    .on("end", (e,d) => { if (!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }));

const sim = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.id).distance(200).strength(.05))
  .force("charge", d3.forceManyBody().strength(-900))
  .force("collide", d3.forceCollide(d => radius(d) + 4))
  .force("x", d3.forceX().strength(.09))
  .force("y", d3.forceY().strength(.09))
  .on("tick", () => {
    link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
    node.attr("cx", d => d.x).attr("cy", d => d.y);
  });

function fit(){
  const w = innerWidth, h = innerHeight;
  svg.attr("viewBox", [-w/2 - 110, -h/2, w, h]);
}
fit(); addEventListener("resize", fit);

// Highlight
function highlight(id){
  node.classed("sel", d => d.id === id);
  const pair = new Set();
  link.each(d => { if (d.source.id === id) pair.add("o"+d.target.id); if (d.target.id === id) pair.add("i"+d.source.id); });
  link.attr("class", d => {
    if (d.source.id === id) return "link " + (pair.has("i"+d.target.id) ? "both" : "out");
    if (d.target.id === id) return "link " + (pair.has("o"+d.source.id) ? "both" : "in");
    return "link";
  });
}
function clearHighlight(){ node.classed("sel", false); link.attr("class","link"); }

// Tooltip
const tip = d3.select("#tip");
function showTip(e,d){ tip.html(`<b>${d.name}</b><br>${d.group}${d.kind && d.kind !== 'person' ? `<br>Conhecimento extraído do CV` : `<br>Recebidas: ${d.rec} · Enviadas: ${d.sent}`}`).style("opacity",1); moveTip(e); }
function showLinkTip(e,d){ const a=d.source.name||d.source, b=d.target.name||d.target; tip.html(`<b>${a} → ${b}</b><br>Afinidade: ${d.affinity.toFixed(1)}%`).style("opacity",1); moveTip(e); }
function moveTip(e){ tip.style("left", (e.clientX+14)+"px").style("top", (e.clientY+14)+"px"); }
function hideTip(){ tip.style("opacity",0); }

// Size toggle
d3.select("#toggle").on("click", () => {
  sizeBySent = !sizeBySent;
  d3.select("#sizeLabel").text(sizeBySent ? "Tamanho: tags enviadas" : "Tamanho: tags recebidas");
  node.transition().duration(400).attr("r", radius);
  sim.force("collide").radius(d => radius(d) + 4); sim.alpha(.3).restart();
});

// Group filter
function applyFilter(){
  node.classed("dim", d => hidden.has(d.group));
  link.classed("dim", d => hidden.has(d.source.group) || hidden.has(d.target.group));
}

// Search
const dl = d3.select("#people");
nodes.slice().sort((a,b) => a.name.localeCompare(b.name)).forEach(n => dl.append("option").attr("value", n.name));
function pick(){
  const n = nodes.find(n => n.name.toLowerCase() === document.getElementById("search").value.trim().toLowerCase());
  if (!n) { d3.select("#info").text("Sem resultados"); return; }
  d3.select("#info").text(`${n.group} · R ${n.rec} · E ${n.sent}`);
  highlight(n.id);
}
d3.select("#pick").on("click", pick);
d3.select("#search").on("keydown", e => { if (e.key === "Enter") pick(); });
